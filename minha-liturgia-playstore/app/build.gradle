apply plugin: 'com.android.application'
apply plugin: 'com.github.triplet.play'

android {
    namespace 'com.minhaliturgia.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.minhaliturgia.app"
        minSdkVersion 21
        targetSdkVersion 36
        // versionCode/versionName locais de referência — em publicações via
        // CI (gradle publishBundle), o Gradle Play Publisher ignora estes
        // valores e usa resolutionStrategy "auto" para buscar o próximo
        // versionCode direto na Play Console, então não precisam ser
        // incrementados manualmente a cada release.
        versionCode 3
        versionName "1.0.2"
    }

    signingConfigs {
        release {
            def storeFilePath = project.findProperty('MINHALITURGIA_RELEASE_STORE_FILE')
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword project.findProperty('MINHALITURGIA_RELEASE_STORE_PASSWORD')
                keyAlias project.findProperty('MINHALITURGIA_RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('MINHALITURGIA_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.findProperty('MINHALITURGIA_RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Trusted Web Activity: empacota o PWA como app Android, abrindo o
    // conteúdo do site dentro de uma "casca" nativa via Chrome Custom Tabs.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.1'
}

// Gradle Play Publisher: permite rodar (via Android Studio ou "gradle" na
// linha de comando)
//   publishBundle    -> envia o .aab (versionCode automático)
//   publishListing   -> envia textos + imagens da ficha da loja
//   publish          -> os dois de uma vez
// A credencial só existe no ambiente de CI (ver .github/workflows/release-android.yml
// e o README, seção "Publicação automática"); sem ela, esses comandos falham
// de propósito e o fluxo local no Android Studio continua funcionando normalmente.
play {
    def credsPath = System.getenv('PLAY_SERVICE_ACCOUNT_JSON_PATH')
    if (credsPath) {
        serviceAccountCredentials.set(file(credsPath))
    }
    track.set(project.findProperty('play.track') ?: 'production')
    defaultToAppBundles.set(true)
    resolutionStrategy.set(com.github.triplet.gradle.androidpublisher.ResolutionStrategy.AUTO)
    releaseStatus.set(com.github.triplet.gradle.androidpublisher.ReleaseStatus.COMPLETED)
}
